<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="2026년 가을 11개 대학 30개 미대 졸업전시 일정을 한 달력에서. 구·동 이름으로 같은 날 함께 볼 전시를 묶어 주는 동선짜기 기능.">
<meta property="og:type" content="website">
<meta property="og:title" content="미대 졸업전시 캘린더 2026">
<meta property="og:description" content="2026년 가을 11개 대학 30개 미대 졸업전시 일정을 한 달력에서. 구·동 이름으로 같은 날 함께 볼 전시를 묶어 주는 동선짜기 기능.">
<meta property="og:url" content="https://entjs-whale.github.io/art-grad-calendar/">
<meta name="twitter:card" content="summary">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>미대 졸업전시 캘린더 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 월달력(좌) + 상세/목록 패널(우, 데스크톱 sticky · 모바일 하단 시트). 막대 색=학교 계열, 패턴=학과 */
:root{
  --paper:#F2F3F1; --sheet:#FFFFFF; --ink:#16181B; --muted:#62686E; --line:#D8DBD7; --out:#EAECE9;
  --accent:#3143C8; --sun:#BE3B28; --sat:#3143C8;
  --pat:rgba(255,255,255,.22); --lift:0; --scrim:rgba(14,16,18,.42);
  --f-display:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --lane:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111315; --sheet:#191C1F; --ink:#E7E9E6; --muted:#9BA2A7; --line:#2D3236; --out:#15181A;
  --accent:#8E9CFF; --sun:#FF8B76; --sat:#8E9CFF; --pat:rgba(255,255,255,.2); --lift:9; --scrim:rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#111315; --sheet:#191C1F; --ink:#E7E9E6; --muted:#9BA2A7; --line:#2D3236; --out:#15181A;
  --accent:#8E9CFF; --sun:#FF8B76; --sat:#8E9CFF; --pat:rgba(255,255,255,.2); --lift:9; --scrim:rgba(0,0,0,.6);
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1.15;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:62ch}
.monthnav{display:flex;align-items:center;gap:8px}
.mbtn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.mbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mbtn:disabled{opacity:.35;cursor:default}
.arrow{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;font-size:13px}
.chip .sw{width:12px;height:12px;border-radius:3px;background:hsl(var(--h) calc(var(--s)*1%) calc((var(--l) + var(--lift))*1%))}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .sw{background:transparent;outline:1.5px solid var(--muted);outline-offset:-1.5px}
.chip.all{padding-left:11px}

/* main layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.cal{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.calhead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.calhead h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}
.calhead .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dow,.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:var(--lane);row-gap:3px;padding:30px 0 10px;min-height:104px;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.cells{position:absolute;inset:0}
.cell{border-right:1px solid var(--line);padding:5px 7px}
.cell:last-child{border-right:0}
.cell.out{background:var(--out)}
.num{font-family:var(--f-mono);font-size:12px;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px}
.cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
.cell.out .num{opacity:.45}
.cell.today .num{background:var(--accent);color:var(--sheet);font-weight:500}

.bar{position:relative;z-index:1;margin:0 3px;border:0;border-radius:4px;cursor:pointer;text-align:left;
  padding:0 7px;height:var(--lane);display:flex;align-items:center;min-width:0;overflow:hidden;
  color:#fff;font-size:11.5px;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 1px rgba(0,0,0,.35);
  background-color:hsl(var(--h) calc(var(--s)*1%) calc((var(--l) + var(--lift))*1%));
  transition:transform .12s ease, box-shadow .12s ease}
.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .short{display:none}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.bar:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.bar.ended{opacity:.42}
.bar.sel{outline:2px solid var(--ink);outline-offset:1px;opacity:1;z-index:2}

/* patterns */
[data-p="0"]{background-image:repeating-linear-gradient(45deg,var(--pat) 0 3px,transparent 3px 8px)}
[data-p="1"]{background-image:radial-gradient(var(--pat) 1.3px,transparent 1.7px);background-size:6px 6px}
[data-p="2"]{background-image:repeating-linear-gradient(0deg,var(--pat) 0 2px,transparent 2px 6px)}
[data-p="3"]{background-image:repeating-linear-gradient(45deg,var(--pat) 0 1.5px,transparent 1.5px 6px),repeating-linear-gradient(-45deg,var(--pat) 0 1.5px,transparent 1.5px 6px)}
[data-p="4"]{background-image:repeating-linear-gradient(90deg,var(--pat) 0 2px,transparent 2px 7px)}
[data-p="5"]{background-image:conic-gradient(var(--pat) 25%,transparent 0 50%,var(--pat) 0 75%,transparent 0);background-size:8px 8px}
[data-p="6"]{background-image:repeating-linear-gradient(-45deg,var(--pat) 0 6px,transparent 6px 13px)}
[data-p="7"]{background-image:linear-gradient(var(--pat) 1px,transparent 1px),linear-gradient(90deg,var(--pat) 1px,transparent 1px);background-size:6px 6px}

/* side panel */
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
.agenda{padding:16px}
.agenda h3{font-size:13px;font-weight:600;margin:0 0 4px}
.agenda .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.aitem:hover{background:var(--out)}
.aitem .sw{width:10px;height:30px;border-radius:2px;background-color:hsl(var(--h) calc(var(--s)*1%) calc((var(--l) + var(--lift))*1%))}
.aitem .t{font-weight:600;font-size:13px;line-height:1.35}
.aitem .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.aitem.ended{opacity:.5}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.pill.soon{color:var(--accent);border-color:var(--accent)}

.detail{display:flex;flex-direction:column}
.dstrip{height:46px;background-color:hsl(var(--h) calc(var(--s)*1%) calc((var(--l) + var(--lift))*1%));position:relative}
.dbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtop .eyebrow{letter-spacing:.06em;text-transform:none;font-size:12px}
.dtop h2{font-size:17px;font-weight:600;margin:2px 0 0;line-height:1.35;text-wrap:balance}
.close{border:1px solid var(--line);background:var(--sheet);border-radius:999px;width:32px;height:32px;flex:none;cursor:pointer;font-size:15px;line-height:1}
.etitle{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.3;margin:0;text-wrap:balance;word-break:keep-all}
.etitle.none{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px 12px;border-top:1px solid var(--line);padding-top:14px}
dt{font-size:12px;color:var(--muted);font-weight:500;padding-top:1px}
dd{margin:0;min-width:0;font-size:13.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hours{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.hours span:nth-child(odd){color:var(--muted)}
.notes{margin:0;padding:10px 12px;background:var(--out);border-radius:4px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.notes p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;color:var(--ink);text-decoration:none;font-weight:500;font-size:13px}
.link:hover{background:var(--ink);color:var(--paper)}
.sibs{display:flex;flex-direction:column;gap:6px}
.sibs .lab{font-size:12px;color:var(--muted)}
.sibs .row{display:flex;flex-wrap:wrap;gap:6px}
.sib{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted);word-break:break-all}
.side.has-detail .agenda{display:none}
.side.has-route .agenda{display:none}
.side.has-detail .route{display:none}
.scrim{display:none}

/* 동선짜기 */
.route-bar{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px}
.rform{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0}
.rlab{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-right:6px}
.rlab small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)}
.rform input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
#rq{flex:1 1 240px}
#rdate{flex:0 1 auto;font-family:var(--f-mono);font-size:13px}
.rbtn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:600}
.rbtn.ghost{background:none;color:var(--ink);border-color:var(--line);font-weight:500}
.rquick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rquick .lab,.route .lab{font-size:12px;color:var(--muted)}
.rquick .lab{margin-right:2px}
.rqc{border:1px dashed var(--muted);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.rqc b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);margin-left:5px}
.rqc[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rqc[aria-pressed="true"] b{color:inherit}
.rmsg{margin:0;font-size:13px;color:var(--sun)}
.bar.dim{opacity:.13}
.cell.pick{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.pick .num::after{content:"동선";font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--accent);margin-left:4px}
.cell.pick .num{width:auto}

.route{padding:16px;display:flex;flex-direction:column;gap:14px}
#routeInline .route{padding:12px 0 2px;border-top:1px solid var(--line)}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rhead .eyebrow{text-transform:none;letter-spacing:.04em;font-size:12px}
.rhead h3{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.3}
.rnote{margin:0;font-size:12.5px;color:var(--muted)}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 0}
.stop+.stop{border-top:1px solid var(--line)}
.stop:not(:last-child)::before{content:"";position:absolute;left:13px;top:42px;bottom:-6px;border-left:1.5px dashed var(--muted);opacity:.55}
.stop .no{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;color:#fff;
  background-color:hsl(var(--h) calc(var(--s)*1%) calc((var(--l) + var(--lift))*1%))}
.sbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.st{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:13.5px;cursor:pointer;line-height:1.4}
.st:hover{text-decoration:underline}
.sm{font-family:var(--f-mono);font-size:12.5px}
.sv{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:2px}
.tag{font-size:11px;border-radius:3px;padding:1px 7px;background:var(--out);color:var(--muted);text-decoration:none}
.tag.hot{background:var(--accent);color:var(--sheet)}
a.tag{border:1px solid var(--line);background:none;color:var(--ink)}
.closedlist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.rdays{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rday{border:1px solid var(--line);background:none;border-radius:4px;padding:4px 8px;font-family:var(--f-mono);font-size:11.5px;cursor:pointer}
.rday.max{border-color:var(--accent);color:var(--accent)}
.rday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.rgo{border:1px solid var(--ink);background:none;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer}
.rgo:hover{background:var(--ink);color:var(--paper)}
.foot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px;max-width:90ch}
.foot p{margin:0}
.foot a,.src a{color:var(--ink);text-underline-offset:2px}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .side.has-detail .agenda{display:block}
  .detail{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:80vh;overflow:auto;background:var(--sheet);
    border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .dstrip{border-radius:14px 14px 0 0}
  .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:40}
}
@media (max-width:640px){
  :root{--lane:20px}
  .bar{font-size:10.5px;padding:0 4px;margin:0 1px}
  .bar .full{display:none} .bar .short{display:block}
  .cell{padding:4px 3px}
  .num{font-size:11px;min-width:20px;height:20px}
  .week{padding-top:27px;min-height:84px}
  .dow div{padding:6px 3px;text-align:center}
  .head{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.bar{transition:none}.bar:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Graduation Shows · 2026 Fall</div>
      <h1>미대 졸업전시 캘린더 2026</h1>
      <p class="sub" id="sub"></p>
    </div>
    <nav class="monthnav" aria-label="월 이동">
      <button class="mbtn arrow" id="prev" aria-label="이전 달">‹</button>
      <div id="mtabs" style="display:flex;gap:6px"></div>
      <button class="mbtn arrow" id="next" aria-label="다음 달">›</button>
    </nav>
  </header>

  <div class="filters" id="filters" role="group" aria-label="학교 필터"></div>

  <section class="route-bar" aria-label="동선짜기">
    <form class="rform" id="rform" autocomplete="off">
      <label class="rlab" for="rq">동선짜기 <small>같은 날, 같은 동네에서 함께 볼 수 있는 전시를 묶어 드려요</small></label>
      <input id="rq" list="rlist" placeholder="구 또는 동 이름 (예: 종로구, 인사동, 대학로)">
      <datalist id="rlist"></datalist>
      <input type="date" id="rdate" min="2026-10-13" max="2026-12-19" aria-label="방문 날짜">
      <button class="rbtn" type="submit">동선 찾기</button>
      <button class="rbtn ghost" type="button" id="rclear" hidden>지우기</button>
    </form>
    <div class="rquick" id="rquick"></div>
    <p class="rmsg" id="rmsg" hidden></p>
    <div id="routeInline"></div>
  </section>

  <div class="main">
    <section class="cal" aria-label="월달력">
      <div class="calhead"><h2 id="mtitle"></h2><span class="meta" id="mmeta"></span></div>
      <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div id="weeks"></div>
    </section>
    <aside class="side" id="side">
      <div class="detail" id="detail" hidden role="dialog" aria-modal="false" aria-labelledby="dname"></div>
      <div id="routeSide"></div>
      <div class="agenda" id="agenda"></div>
    </aside>
  </div>
  <footer class="foot" id="foot"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>

<script>
const SCHOOLS = {
  hongik:  {name:'홍익대학교',      short:'홍익대',   h:304, s:44, l:38},

/* ---------- helpers ---------- */
const WD=['일','월','화','수','목','금','토'];
const dn=(y,m,d)=>Math.round(Date.UTC(y,m,d)/864e5);
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return dn(y,m-1,d)};
const fromDn=n=>{const t=new Date(n*864e5);return {y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate(),w:t.getUTCDay()}};
const p2=n=>String(n).padStart(2,'0');
const fmt=n=>{const t=fromDn(n);return `${p2(t.m+1)}.${p2(t.d)} (${WD[t.w]})`};
const now=new Date(); const TODAY=dn(now.getFullYear(),now.getMonth(),now.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// derive per-event fields: dates, colour shade, pattern
const order=Object.keys(SCHOOLS); const counters={};
EVENTS.forEach(e=>{
  const sc=SCHOOLS[e.school]; const i=counters[e.school]=(counters[e.school]??-1)+1;
  e.s=parse(e.start); e.e=parse(e.end);
  e.h=sc.h+((i%5)-2)*7; e.sat=sc.s; e.l=sc.l+((i%3)-1)*4;
  e.p=(i+order.indexOf(e.school)*3)%8;
  e.kind=e.kind||'졸업전시회';
  e.label=`${sc.name} ${e.dept} ${e.kind}`;
  const part=e.kind.match(/[12]부/); e.shortLabel=`${sc.short} ${e.dept.replace(/(전공|학과|과)$/,'')}${part?' '+part[0]:''}`;
});
/* 전시장 지역 (구·동). 주소가 이미지에 없는 캠퍼스는 학교 소재지 기준 */
const VENUES={
  hongik:  {sido:'서울',gu:'마포구',dong:'상수동',alias:['홍대','홍익대','서교동']},
  ewha:    {sido:'서울',gu:'서대문구',dong:'대현동',alias:['신촌','이대']},
  chugye:  {sido:'서울',gu:'서대문구',dong:'북아현동',alias:['아현','충정로']},
  kookmin: {sido:'서울',gu:'성북구',dong:'정릉동',alias:['정릉','국민대']},
  dongguk: {sido:'서울',gu:'중구',dong:'장충동2가',alias:['필동','충무로','동국대']},

  insadong:{sido:'서울',gu:'종로구',dong:'관훈동',alias:['인사동','안국']},
  daehakro:{sido:'서울',gu:'종로구',dong:'연건동',alias:['대학로','혜화']},
  kyunghee:{sido:'경기',gu:'용인시 기흥구',dong:'서천동',alias:['용인','기흥','국제캠퍼스']},
  konkukG: {sido:'충북',gu:'충주시',dong:'단월동',alias:['충주','글로컬캠퍼스']},
  hannam:  {sido:'대전',gu:'대덕구',dong:'오정동',alias:['대전','한남대']},
};
const VENUE_OF={'konkuk-fa1':'konkukG','konkuk-fa2':'insadong','konkuk-vcd':'daehakro','kyonggi-western':'insadong','suwon-craft':'insadong','hywu-knit':'ddp'};
const norm=s=>String(s||'').replace(/^\s*동선\s*짜기\s*[-–:]?\s*/,'').replace(/\s+/g,'').toLowerCase();
Object.values(VENUES).forEach(v=>{
  const raw=[v.sido,v.gu,v.gu.split(' ').pop(),v.dong,v.sido+v.gu,...v.alias];
  const t=new Set(); raw.forEach(r=>{const n=norm(r);t.add(n);const cut=n.replace(/(구|시|동)$/,'');if(cut.length>=2)t.add(cut)});
  v.tokens=[...t]; v.where=`${v.sido} ${v.gu} ${v.dong}`; v.nick=v.alias[0];
  v.guLabel=v.sido==='서울'?v.gu:(v.gu.includes('시')?v.gu:`${v.sido} ${v.gu}`);
});
EVENTS.forEach(e=>{e.v=VENUES[VENUE_OF[e.id]||e.school]});
const matchV=(v,q)=>{const n=norm(q);return !!n&&v.tokens.some(t=>t===n||(n.length>=2&&t.startsWith(n)))};

/* 날짜별 관람 시간 해석: '매일', '화–금', '수–월'(요일 순환), '11.10–11.13', '11.09 (월)' 형식 */
function hoursOn(e,day){
  if(!e.hours) return {open:true,text:null};
  const w=fromDn(day).w;
  for(const [k,v] of e.hours){
    const key=k.replace(/\s*\(.*?\)\s*/g,'').trim(); let m;
    if(key==='매일') return {open:true,text:v};
    if((m=key.match(/^(\d{2})\.(\d{2})(?:–(\d{2})\.(\d{2}))?$/))){
      const a=dn(2026,+m[1]-1,+m[2]), b=m[3]?dn(2026,+m[3]-1,+m[4]):a;
      if(day>=a&&day<=b) return {open:true,text:v}; continue;
    }
    if((m=key.match(/^([일월화수목금토])(?:–([일월화수목금토]))?$/))){
      const a=WD.indexOf(m[1]), b=m[2]?WD.indexOf(m[2]):a;
      if(a<=b?(w>=a&&w<=b):(w>=a||w<=b)) return {open:true,text:v};
    }
  }
  return {open:false,text:'휴관'};
}
const toMin=s=>{const m=s&&s.match(/(\d{1,2}):(\d{2})/g);if(!m)return null;return m.map(x=>{const [h,mm]=x.split(':');return +h*60+ +mm})};
const status=e=> TODAY<e.s ? {cls:'soon',txt:`D-${e.s-TODAY}`} : TODAY>e.e ? {cls:'',txt:'종료'} : {cls:'live',txt:'진행 중'};
const colorVars=e=>`--h:${e.h};--s:${e.sat};--l:${e.l}`;

/* ---------- state ---------- */
const MONTHS=[[2026,9],[2026,10],[2026,11]];
let mi=(()=>{const t=fromDn(TODAY);const k=MONTHS.findIndex(([y,m])=>y===t.y&&m===t.m);return k>=0?k:(TODAY<dn(2026,9,1)?0:2)})();
const active=new Set(order); let selected=null;
const visible=()=>EVENTS.filter(e=>active.has(e.school));

/* ---------- header bits ---------- */
document.getElementById('sub').textContent=
  `${Object.keys(SCHOOLS).length}개 대학 · ${EVENTS.length}개 전시 · 2026.10.13 – 12.19. 막대를 누르면 전시명, 기간, 장소가 열립니다. 최종 업데이트 ${UPDATED}`;
document.getElementById('foot').innerHTML=
  `<p>전시 정보 출처: <a href="${CREDIT_URL}" target="_blank" rel="noopener">${CREDIT}</a> 인스타그램 게시물에 소개된 각 학과 졸업전시 포스터와 홍익대학교 미술대학 졸업전시 일정표를 옮겨 정리했습니다. 전시장 지역(구·동)은 공개된 주소를 따로 확인해 붙였습니다.</p>
   <p>출처끼리 시간이 다른 전시는 상세 정보에 함께 적었습니다. 일정은 학과 사정으로 바뀔 수 있으니 방문 전 각 학과 공식 계정을 확인하세요.</p>

const filters=document.getElementById('filters');
function renderFilters(){

/* ---------- calendar ---------- */
function render(){
  renderFilters();
  const [y,m]=MONTHS[mi];
  MONTHS.forEach((_,k)=>document.getElementById('mt'+k).setAttribute('aria-pressed',k===mi));
  document.getElementById('prev').disabled=mi===0; document.getElementById('next').disabled=mi===MONTHS.length-1;
  document.getElementById('mtitle').textContent=`${y}년 ${m+1}월`;
  const mStart=dn(y,m,1), mEnd=dn(y,m+1,0);
  const inMonth=visible().filter(e=>e.s<=mEnd&&e.e>=mStart);
  document.getElementById('mmeta').textContent=`이달 전시 ${inMonth.length}건`;

  const lead=fromDn(mStart).w, gridStart=mStart-lead, nWeeks=Math.ceil((lead+(mEnd-mStart+1))/7);
  let html='';
  for(let w=0;w<nWeeks;w++){
    const ws=gridStart+w*7, we=ws+6;
    let cells='';
    for(let d=0;d<7;d++){const n=ws+d,t=fromDn(n);
      const cls=['cell',d===0?'sun':'',d===6?'sat':'',(n<mStart||n>mEnd)?'out':'',n===TODAY?'today':'',(routeQ&&n===routeDay)?'pick':''].join(' ');
      cells+=`<div class="${cls}"><span class="num"${n===TODAY?' title="오늘"':''}>${t.d}</span></div>`}
    const evs=visible().filter(e=>e.s<=we&&e.e>=ws).sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
    const laneEnd=[]; let bars='';
    evs.forEach(e=>{
      const a=Math.max(e.s,ws)-ws, b=Math.min(e.e,we)-ws;
      let lane=laneEnd.findIndex(x=>x<a); if(lane<0){lane=laneEnd.length;laneEnd.push(b)} else laneEnd[lane]=b;
      const cls=['bar',e.s<ws?'cl':'',e.e>we?'cr':'',TODAY>e.e?'ended':'',selected===e?'sel':'',(routeQ&&!matchV(e.v,routeQ))?'dim':''].join(' ');
      bars+=`<button class="${cls}" data-id="${e.id}" data-p="${e.p}" style="${colorVars(e)};grid-column:${a+1}/${b+2};grid-row:${lane+1}"
        aria-label="${esc(e.label)}, ${fmt(e.s)}부터 ${fmt(e.e)}까지"><span class="full">${esc(e.label)}</span><span class="short">${esc(e.shortLabel)}</span></button>`;
    });
    html+=`<div class="week"><div class="cells">${cells}</div>${bars}</div>`;
  }
  document.getElementById('weeks').innerHTML=html;
  renderAgenda(inMonth,m);
  renderRoute();
}

     <ul class="alist">${sorted.map(e=>{const st=status(e);

const side=document.getElementById('side'), detail=document.getElementById('detail'), scrim=document.getElementById('scrim');
function openDetail(e){

      <div class="actions"><a class="link" href="https://map.naver.com/p/search/${encodeURIComponent(e.map||e.venue)}" target="_blank" rel="noopener">네이버 지도에서 찾기 ↗</a>
        <button class="rgo" data-act="routefrom">${esc(e.v.guLabel)} 동선짜기</button></div>
      ${sibs.length?`<div class="sibs"><span class="lab">${esc(sc.short)}의 다른 일정</span><div class="row">${sibs.map(x=>`<button class="sib" data-id="${x.id}">${esc(x.dept)}${/[12]부/.test(x.kind)?' '+x.kind.match(/[12]부/)[0]:''} · ${fmt(x.s).slice(0,5)}</button>`).join('')}</div></div>`:''}
      <div class="src">출처: <a href="${CREDIT_URL}" target="_blank" rel="noopener">${CREDIT}</a> 인스타그램 게시물${e.src.includes(S_HG)?' (홍익대학교 미술대학 졸업전시 일정표 포함)':''} · 정보 오류는 <a href="${ISSUE_URL}" target="_blank" rel="noopener">여기로 제보</a></div>
    </div>`;
  detail.hidden=false; side.classList.add('has-detail');

  const [cy,cm]=MONTHS[mi]; const curS=dn(cy,cm,1), curE=dn(cy,cm+1,0);

function closeDetail(rerender=true){
  selected=null; detail.hidden=true; scrim.hidden=true; side.classList.remove('has-detail');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
  if(rerender) render();

detail.addEventListener('click',ev=>{
  if(ev.target.closest('#dclose')) return closeDetail();
  if(ev.target.closest('[data-act="routefrom"]')){
    const e=selected, d=Math.min(Math.max(TODAY,e.s),e.e);
    closeDetail(false); setRoute(e.v.guLabel,d); return;
  }
  const s=ev.target.closest('.sib'); if(s) openDetail(EVENTS.find(e=>e.id===s.dataset.id));

/* ---------- 동선짜기 ---------- */
let routeQ=null, routeDay=null, dateTouched=false;
const RANGE_S=Math.min(...EVENTS.map(e=>e.s)), RANGE_E=Math.max(...EVENTS.map(e=>e.e));
const rq=document.getElementById('rq'), rdate=document.getElementById('rdate'), rmsg=document.getElementById('rmsg');
const routeSide=document.getElementById('routeSide'), routeInline=document.getElementById('routeInline');
const narrowMQ=matchMedia('(max-width:900px)');
const iso=n=>{const t=fromDn(n);return `${t.y}-${p2(t.m+1)}-${p2(t.d)}`};
const fmtLong=n=>{const t=fromDn(n);return `${t.m+1}월 ${t.d}일 (${WD[t.w]})`};

function stopsOn(q,day){
  const evs=EVENTS.filter(e=>matchV(e.v,q)&&e.s<=day&&e.e>=day).map(e=>({e,h:hoursOn(e,day)}));
  return {open:evs.filter(x=>x.h.open), closed:evs.filter(x=>!x.h.open)};
}
function dayCounts(q){
  const from=Math.max(TODAY,RANGE_S), out=[];
  for(let d=from; d<=RANGE_E; d++) out.push([d,stopsOn(q,d).open.length]);
  return out;
}
function bestDay(q){
  let c=dayCounts(q).filter(x=>x[1]>0);
  if(!c.length){ for(let d=RANGE_S; d<=RANGE_E; d++){const n=stopsOn(q,d).open.length; if(n) c.push([d,n])} }
  if(!c.length) return null;
  const mx=Math.max(...c.map(x=>x[1])); return c.find(x=>x[1]===mx)[0];
}
function regionTitle(q){
  const vs=Object.values(VENUES).filter(v=>matchV(v,q));
  if(vs.length===1) return `${vs[0].gu} ${vs[0].dong}`;
  if(vs.length && vs.every(v=>v.gu===vs[0].gu)) return vs[0].guLabel;
  return q.trim();
}

// 빠른 선택 칩(구 단위 + 자주 찾는 동네)과 자동완성
(function buildQuick(){
  const gus={}; EVENTS.forEach(e=>{gus[e.v.guLabel]=(gus[e.v.guLabel]||0)+1});
  const hoods=['인사동','대학로','신촌'];
  const chips=Object.entries(gus).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k,n])
    .concat(hoods.map(h=>[h,EVENTS.filter(e=>matchV(e.v,h)).length]));
  document.getElementById('rquick').innerHTML='<span class="lab">바로 찾기</span>'+
    chips.map(([k,n],i)=>`<button class="rqc" id="rqc${i}" data-q="${esc(k)}" aria-pressed="false">${esc(k)}<b>${n}</b></button>`).join('');
  const opts=new Set(); Object.values(VENUES).forEach(v=>{opts.add(v.guLabel);opts.add(v.dong);v.alias.forEach(a=>opts.add(a))});
  document.getElementById('rlist').innerHTML=[...opts].map(o=>`<option value="${esc(o)}">`).join('');
})();

function setRoute(q,day){
  q=String(q||'').replace(/^\s*동선\s*짜기\s*[-–:]?\s*/,'').trim();
  if(!q){clearRoute();return}
  if(!Object.values(VENUES).some(v=>matchV(v,q))){
    rmsg.textContent=`‘${q}’에 있는 전시장을 찾지 못했어요. 구나 동 이름으로 다시 찾아보세요. 예: 종로구, 인사동, 대학로, 서대문구`;
    rmsg.hidden=false; return;
  }
  rmsg.hidden=true; routeQ=q; rq.value=q;
  routeDay=day ?? bestDay(q) ?? Math.max(TODAY,RANGE_S);
  rdate.value=iso(routeDay); document.getElementById('rclear').hidden=false;
  const t=fromDn(routeDay), k=MONTHS.findIndex(([y,m])=>y===t.y&&m===t.m); if(k>=0) mi=k;
  render();
  if(narrowMQ.matches) routeInline.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest'});
}
function clearRoute(){
  routeQ=null; routeDay=null; dateTouched=false; rq.value=''; rmsg.hidden=true;
  document.getElementById('rclear').hidden=true; render();
}
function renderRoute(){
  document.querySelectorAll('.rqc').forEach(b=>b.setAttribute('aria-pressed', !!routeQ && norm(b.dataset.q)===norm(routeQ)));
  const narrow=narrowMQ.matches;
  side.classList.toggle('has-route', !!routeQ && !narrow);
  if(!routeQ){routeSide.innerHTML='';routeInline.innerHTML='';return}
  const title=regionTitle(routeQ), {open,closed}=stopsOn(routeQ,routeDay);
  // 같은 동끼리 묶고, 묶음 안에서는 마감이 이른 곳부터
  const close=x=>{const m=toMin(x.h.text);return m?m[m.length-1]:1e4};
  const start=x=>{const m=toMin(x.h.text);return m?m[0]:0};
  const groups={}; open.forEach(x=>{(groups[x.e.v.dong]=groups[x.e.v.dong]||[]).push(x)});
  const ordered=Object.values(groups).map(g=>g.sort((a,b)=>close(a)-close(b)||start(a)-start(b)))
    .sort((a,b)=>close(a[0])-close(b[0])).flat();
  const dongs=Object.keys(groups);
  const counts=dayCounts(routeQ), multi=counts.filter(x=>x[1]>=2), mx=Math.max(0,...counts.map(x=>x[1]));
  const stop=(x,i)=>{
    const e=x.e, op=e.opening&&e.opening.match(/^(\d{2})\.(\d{2})/), opDay=op?dn(2026,+op[1]-1,+op[2]):null;
    const opTime=opDay===routeDay?(e.opening.match(/\d{1,2}:\d{2}/)||[''])[0]:'';
    return `<li class="stop"><span class="no" style="${colorVars(e)}">${i+1}</span><div class="sbody">
      <button class="st" data-id="${e.id}">${esc(e.label)}</button>
      <span class="sm">${x.h.text?esc(x.h.text):'관람 시간 미기재'}</span>
      <span class="sv">${esc(e.venue)}</span>
      <span class="tags"><span class="tag">${esc(e.v.dong)} · ${esc(e.v.nick)}</span>
        ${opTime?`<span class="tag hot">오프닝 ${opTime}</span>`:''}${routeDay===e.e&&e.e!==e.s?'<span class="tag">마지막 날</span>':''}
        <a class="tag" href="https://map.naver.com/p/search/${encodeURIComponent(e.map||e.venue)}" target="_blank" rel="noopener">지도 ↗</a></span>
    </div></li>`};
  const html=`<div class="route">
    <div class="rhead"><div><div class="eyebrow">동선짜기 · ${esc(title)}</div><h3>${fmtLong(routeDay)} · ${open.length}곳</h3></div>
      <button class="close" data-act="rclose" aria-label="동선 닫기">✕</button></div>
    ${open.length?`<p class="rnote">${dongs.length>1?`${dongs.map(esc).join(' · ')} 순으로 동네를 묶고, `:''}마감이 이른 곳부터 번호를 매겼어요. 이름을 누르면 상세 정보가 열립니다.</p>
      <ol class="stops">${ordered.map(stop).join('')}</ol>`
      :`<p class="rnote">이날 ${esc(title)}에서 관람할 수 있는 전시가 없어요. 아래 날짜 중에서 골라 보세요.</p>`}
    ${closed.length?`<div class="closedlist"><span class="lab">이날 휴관 (전시 기간 중)</span>${closed.map(x=>`<span>${esc(x.e.label)}</span>`).join('')}</div>`:''}
    <div><span class="lab">${multi.length?`${esc(title)}에서 두 곳 이상 함께 볼 수 있는 날 (오늘 이후)`:`${esc(title)}에서 전시가 열리는 날 (오늘 이후, 하루 한 곳)`}</span>
      <div class="rdays">${(multi.length?multi:counts.filter(x=>x[1]>0)).slice(0,24).map(([d,n])=>
        `<button class="rday${n===mx&&n>1?' max':''}" data-day="${d}" aria-pressed="${d===routeDay}">${fmt(d)} · ${n}곳</button>`).join('')||'<span class="rnote">남은 일정이 없어요.</span>'}</div></div>
  </div>`;
  (narrow?routeInline:routeSide).innerHTML=html; (narrow?routeSide:routeInline).innerHTML='';
}
document.getElementById('rform').addEventListener('submit',ev=>{ev.preventDefault();setRoute(rq.value,dateTouched&&rdate.value?parse(rdate.value):null)});
rdate.addEventListener('change',()=>{ if(!rdate.value) return; dateTouched=true;
  if(routeQ){routeDay=Math.min(Math.max(parse(rdate.value),RANGE_S),RANGE_E);const t=fromDn(routeDay),k=MONTHS.findIndex(([y,m])=>y===t.y&&m===t.m);if(k>=0)mi=k;render()} });
document.getElementById('rclear').addEventListener('click',clearRoute);
document.getElementById('rquick').addEventListener('click',ev=>{const b=ev.target.closest('.rqc'); if(b) setRoute(b.dataset.q, dateTouched&&rdate.value?parse(rdate.value):null)});
[routeSide,routeInline].forEach(el=>el.addEventListener('click',ev=>{
  if(ev.target.closest('[data-act="rclose"]')) return clearRoute();
  const d=ev.target.closest('.rday'); if(d){ setRoute(routeQ,+d.dataset.day); dateTouched=true; return; }
  const s=ev.target.closest('.st'); if(s) openDetail(EVENTS.find(e=>e.id===s.dataset.id));
}));
narrowMQ.addEventListener('change',()=>renderRoute());

render();
const fromHash=EVENTS.find(e=>'#'+e.id===location.hash); if(fromHash) openDetail(fromHash);
</script>
</body>
</html>
